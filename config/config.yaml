noaa:
  base_url: "https://www.ncei.noaa.gov/pub/data/ghcn/daily"
  metadata_files:
    - ghcnd-stations.txt
    - ghcnd-inventory.txt
    - ghcnd-countries.txt
    - readme.txt

paths:
  raw_dir: "data/raw"
  duckdb_path: "data/weather.duckdb"
  stations_seed: "weather_dbt/seeds/target_stations.csv"
  schemas: "config/fixed_width_schemas.yaml"

narratives:
  model_name: "gemini-3.5-flash-lite"
  batch_size: 25
  sleep_between_batches_seconds: 5
  retry_seconds: 30
  max_stalled_batches: 3